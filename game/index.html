<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>KOTA ARUNA</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #160f22;
      color: #ffd9a8;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    /* The whole page is the viewport; the WebGL canvas paints the city edge to edge. */
    #game {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      outline: none;
    }

    /* Overlay for the HUD. Empty until the game modules populate it. */
    #hud {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      user-select: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
